<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nossa história, pelos olhos dela.</title>
    <link rel="icon" type="image/png" href="favicon.icon">

    <link rel="preload" as="image" href="imagens/fundo-inicial1.png">
    <link rel="preload" as="image" href="imagens/fundo-inicial2.png">
    <link rel="preload" as="image" href="imagens/fundo-historia1.png">
    
    <link rel="preload" as="image" href="imagens/final.png">
    <link rel="preload" as="image" href="imagens/lembranca1.png">
    <link rel="preload" as="image" href="imagens/lembranca2.png">
    <link rel="preload" as="audio" href="audios/musica-inicial.mp3">
    <link rel="preload" as="audio" href="audios/audio1.m4a">
    <link rel="preload" as="audio" href="audios/musicafinal.m4a">




    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

    <!-- TELA DE COLOCAR O NOME (PRIMEIRA) -->
<div id="startScreen" class="screen active start-bg">
    <div class="start-box">
        <h1 class="intro-title">Nossa história, pelos olhos dela.</h1>

        <p class="start-subtitle">Digite seu nome para começar</p>

        <input type="text" id="playerName" placeholder="Seu nome">

        <div id="nameAlert" class="name-alert">
            Esse jogo é apenas para Samy e Joe ❤️
        </div>

        <button onclick="heartsFromButton(this); goToIntro()">Continuar</button>
    </div>
</div>


<!-- TELA INTRO / COMEÇAR (SEGUNDA) -->
<div id="introScreen" class="screen intro-bg">
    <h1 class="intro-title">Nossa história, pelos olhos dela.</h1>

    <button class="intro-btn" onclick="heartsFromButton(this); enterGame()">Começar</button>

    <audio id="bgMusic" src="audios/musica-inicial.mp3" loop></audio>
</div>


    <!-- TELA DA HISTÓRIA -->
    <div id="storyScreen" class="screen">
        <div id="storyText"></div>

        <audio id="storyAudio"></audio>

        <div class="buttons">
            <button id="btnPrevious" onclick="heartsFromButton(this); previousStory()">Anterior</button>
            <button onclick="heartsFromButton(this); playAudio()">Ouvir história</button>
            <button onclick="heartsFromButton(this); openMemory()">Ver lembrança</button>
            <button onclick="heartsFromButton(this); nextStory()">Próximo</button>
        </div>
    </div>

    <!-- TELA DA LEMBRANÇA -->
    <div id="memoryScreen" class="screen">
        <h1>Uma lembrança especial ✨</h1>
        <img id="memoryImage" src="imagens/lembranca.jpg" alt="Lembrança">
        <p id="memoryHint" class="memory-hint">
        Toque à esquerda ou à direita
    </p>    
        <button onclick="heartsFromButton(this); backToStory()">Voltar</button>
    </div>


    <!-- TELA DO VÍDEO -->
<div id="videoScreen" class="screen">
    <div class="video-hearts" id="videoHearts"></div>
    
    <video id="finalVideo" src="videos/final.mp4"></video>

    <!-- botão oculto -->
    <button id="skipVideoBtn" onclick="heartsFromButton(this); goToFinal()">Continuar</button>
</div>


    <!-- TELA FINAL do site-->
    <div id="endScreen" class="screen">
        <h1>Fim do começo da nossa história 💖</h1>
        <p>Mas toda história bonita pode ser revivida...</p>
        <button onclick="heartsFromButton(this); restartGame()">Voltar ao começo</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
